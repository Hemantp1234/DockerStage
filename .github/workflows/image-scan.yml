name: Docker Image Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-scan-push:
    name: build , scan and push in ghcr
    runs-on: ubuntu-latest

    steps:
      # 1. Pull repository code into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. log in to GHCR using automatic github_token
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'  #it will run once it merged
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build using your multi-stage Dockerfile
      - name: Build Docker Image
        run: |
          docker build -f Dockerfile.multi -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
          

      # 4. Scan the resulting final image with Trivy
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Push Docker Image to GHCR
        if: github.event_name != 'pull_request'  #it will run once it merged
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}