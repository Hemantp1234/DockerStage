name: Docker Image Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write
  

jobs:
  build-scan-push:
    name: build , scan and push in ghcr
    runs-on: ubuntu-latest

    steps:
      #  Pull repository code into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # converting repository name lowecase
      - name: Convert Repository Name to Lowercase
        run : | 
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
        
      # Initializing docker buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # log in to GHCR using automatic github_token
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'  #it will run once it merged
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build an iamge with buildex , add layer and load to local runners for scanning.
      - name: Build image with cache and load to local runner
        uses: docker/build-push-action@v3
        with:
          context: .
          load: true
          tags: ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      #  Scan the resulting final image with Trivy
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      # Pushing an image to GHCR
      - name: Push Docker Image to GHCR
        if: github.event_name != 'pull_request'  #it will run once it merged
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

