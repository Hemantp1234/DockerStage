name: Docker Image Security Scan

on:
workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write
  

jobs:
  build-scan-push:
    name: build , scan and push in ghcr
    runs-on: ubuntu-latest

    steps:
      #  Pull repository code into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # converting repository name lowecase
      - name: Convert Repository Name to Lowercase
        run : | 
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
        
      # Initializing docker buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # log in to GHCR using automatic github_token
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'  #it will run once it merged
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build an iamge with buildex , add layer and load to local runners for scanning.
      - name: Build image with cache and load to local runner
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile.multi
          load: true
          tags: ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      #  Scan the resulting final image with Trivy
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: true

      # Pushing an image to GHCR
      - name: Push Docker Image to GHCR
        if: github.event_name != 'pull_request'  #it will run once it merged
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile.multi
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment on EC2
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATEKEY }}
          script: |
            #login to GHCR first
            echo "${{ secrets.GHCR_PULL }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
            # 2. Pull latest Docker image
            docker pull ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
            
            # 3. Detect active container and assign target color
            if [ "$(docker inspect -f '{{.State.Running}}' app-blue 2>/dev/null)" == "true" ]; then
              NEW="green"; NEW_PORT="8081"; OLD="blue"
            else
              NEW="blue";  NEW_PORT="80";   OLD="green"
            fi

            # 4. Spin up candidate container on temporary port
            docker rm -f app-$NEW 2>/dev/null || true
            docker run -d --name app-$NEW -p $NEW_PORT:80 --restart always ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}

            # 5. Wait for the new container to become healthy instead of failing after a fixed 5s sleep
            STATUS="starting"
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' app-$NEW 2>/dev/null || echo "starting")
              echo "Container app-$NEW status: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              sleep 2
            done

            # 6. Promote if Healthy, Rollback if Unhealthy
            if [ "$STATUS" = "healthy" ]; then
              echo "Container app-$NEW is healthy! Promoting to production..."
              if [ "$NEW" == "green" ]; then
                docker stop app-$OLD || true
                docker rm app-$OLD || true
                docker stop app-$NEW
                docker rm app-$NEW
                docker run -d --name app-blue -p 80:80 --restart always ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
              fi
              echo "Zero-Downtime Deployment Successful!"
            else
              echo "ERROR: Health check failed for app-$NEW! Rolling back..."
              echo "Container logs for app-$NEW:"
              docker logs app-$NEW || true
              docker stop app-$NEW || true
              docker rm app-$NEW || true
              exit 1
            fi