name: Docker Image Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  scan-image:
    name: Scan Container Image
    runs-on: ubuntu-latest

    steps:
      # 1. Pull repository code into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Build using your multi-stage Dockerfile
      - name: Build Docker Image
        run: |
          docker build -f Dockerfile.multi -t my-app:${{ github.sha }} .

      # 3. Scan the resulting final image with Trivy
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true